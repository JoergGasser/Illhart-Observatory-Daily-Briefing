name: ArXiv Daily Briefing

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python arxiv_fetch.py
      - run: |
          git config user.name "arxiv-briefing-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update ArXiv briefing $(date -u +%Y-%m-%d)"
          git push
