<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Illhart — ArXiv Briefing</title>
<style>
:root {
--bg: #000000;
--bg-elev: #0c0c0c;
--bg-card: #111111;
--line: #2a2a2a;
--line-soft: #1a1a1a;
--fg: #ffffff;
--fg-dim: #9a9a9a;
--fg-faint: #5e5e5e;
--accent: #ffffff;
--tier1: #ffffff;
--tier2: #8a8a8a;
--tier3: #4a4a4a;
--title-red: #a8485f;
--mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
--serif: "Georgia", "Iowan Old Style", serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
margin: 0; padding: 0;
background: var(--bg);
color: var(--fg);
font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
height: 100%;
overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100vh; }

header {
flex: 0 0 auto;
padding: 18px 18px 14px;
border-bottom: 1px solid var(--line);
background: var(--bg);
}
.header-top {
display: flex;
justify-content: space-between;
align-items: baseline;
}
.observatory-mark {
font-family: var(--mono);
font-size: 11px;
letter-spacing: 0.18em;
color: var(--fg-faint);
text-transform: uppercase;
}
.date-mark {
font-family: var(--mono);
font-size: 11px;
color: var(--fg-faint);
letter-spacing: 0.05em;
}
h1 {
margin: 6px 0 2px;
font-family: var(--serif);
font-weight: 400;
font-size: 26px;
letter-spacing: 0.01em;
color: var(--title-red);
}
.subhead {
font-size: 12px;
color: var(--fg-dim);
font-family: var(--mono);
letter-spacing: 0.02em;
}

.tabs {
flex: 0 0 auto;
display: flex;
border-bottom: 1px solid var(--line);
background: var(--bg);
}
.tab {
flex: 1;
text-align: center;
padding: 11px 4px;
font-family: var(--mono);
font-size: 11px;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(--fg-faint);
border-bottom: 2px solid transparent;
cursor: pointer;
}
.tab.active { color: var(--fg); border-bottom-color: var(--fg); }
.tab .count {
display: inline-block;
margin-left: 5px;
color: var(--fg-faint);
}
.tab.active .count { color: var(--fg-dim); }

main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.list-view { padding: 14px 14px 90px; }

.card {
border: 1px solid var(--line);
background: var(--bg-card);
border-radius: 2px;
margin-bottom: 12px;
padding: 14px 14px 12px;
position: relative;
cursor: pointer;
transition: border-color 0.15s ease;
}
.card:active { border-color: var(--fg-dim); }

.card-top {
display: flex;
justify-content: space-between;
align-items: flex-start;
gap: 10px;
margin-bottom: 8px;
}
.rank-badge {
flex: 0 0 auto;
width: 30px;
height: 30px;
border: 1px solid var(--line);
display: flex;
align-items: center;
justify-content: center;
font-family: var(--mono);
font-size: 13px;
font-weight: 600;
}
.rank-badge.tier-1 { border-color: var(--fg); color: var(--fg); }
.rank-badge.tier-2 { border-color: var(--fg-dim); color: var(--fg-dim); }
.rank-badge.tier-3 { border-color: var(--fg-faint); color: var(--fg-faint); }

.card-cat {
font-family: var(--mono);
font-size: 10px;
letter-spacing: 0.08em;
color: var(--fg-faint);
text-transform: uppercase;
padding-top: 4px;
flex: 1;
text-align: right;
}

.card-title {
font-family: var(--serif);
font-size: 17px;
line-height: 1.32;
margin: 0 0 6px;
font-weight: 400;
color: var(--title-red);
}
.card-authors {
font-size: 12px;
color: var(--fg-dim);
margin-bottom: 9px;
font-family: var(--mono);
}
.card-verdict {
font-size: 13px;
line-height: 1.5;
color: var(--fg);
border-left: 2px solid var(--line);
padding-left: 10px;
margin-bottom: 10px;
}
.card-tags {
display: flex;
flex-wrap: wrap;
gap: 6px;
}
.tag {
font-family: var(--mono);
font-size: 10px;
letter-spacing: 0.04em;
color: var(--fg-dim);
border: 1px solid var(--line-soft);
padding: 3px 7px;
border-radius: 2px;
}
.tag.good { color: var(--fg); border-color: var(--fg-faint); }

.empty-state, .error-state {
text-align: center;
padding: 60px 20px;
color: var(--fg-faint);
font-family: var(--mono);
font-size: 13px;
line-height: 1.6;
}
.error-state { color: #c98; }

.stale-banner {
flex: 0 0 auto;
font-family: var(--mono);
font-size: 10.5px;
color: #e88;
text-align: center;
padding: 6px 14px;
border-bottom: 1px solid var(--line-soft);
letter-spacing: 0.02em;
}

.detail-view {
display: none;
flex-direction: column;
height: 100%;
}
.detail-view.active { display: flex; }
.detail-scroll {
flex: 1 1 auto;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
padding: 16px 18px 14px;
}
.back-row {
display: flex;
align-items: center;
gap: 8px;
padding: 14px 18px 10px;
border-bottom: 1px solid var(--line);
flex: 0 0 auto;
}
.back-btn {
font-family: var(--mono);
font-size: 12px;
letter-spacing: 0.05em;
color: var(--fg-dim);
cursor: pointer;
padding: 4px 0;
}
.back-btn::before { content: "← "; }

.detail-meta {
font-family: var(--mono);
font-size: 11px;
color: var(--fg-faint);
letter-spacing: 0.06em;
text-transform: uppercase;
margin-bottom: 8px;
}
.detail-title {
font-family: var(--serif);
font-size: 22px;
line-height: 1.3;
margin: 0 0 10px;
font-weight: 400;
color: var(--title-red);
}
.detail-authors {
font-size: 13px;
color: var(--fg-dim);
font-family: var(--mono);
margin-bottom: 18px;
}

.score-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 18px;
}
.score-cell {
border: 1px solid var(--line-soft);
padding: 9px 10px;
}
.score-cell-label {
font-family: var(--mono);
font-size: 9.5px;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--fg-faint);
margin-bottom: 4px;
}
.score-cell-value {
font-size: 13px;
color: var(--fg);
}

.abstract-block { margin-bottom: 20px; }
.section-label {
font-family: var(--mono);
font-size: 10px;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(--fg-faint);
margin-bottom: 8px;
}
.abstract-text {
font-size: 14px;
line-height: 1.6;
color: var(--fg-dim);
}

.arxiv-link {
display: inline-block;
font-family: var(--mono);
font-size: 12px;
color: var(--fg-dim);
border: 1px solid var(--line);
padding: 7px 12px;
text-decoration: none;
margin-bottom: 24px;
}
.arxiv-link:active { border-color: var(--fg); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); }
</style>
</head>
<body>
<div class="app">

<div class="stale-banner" id="staleBanner" style="display:none;"></div>

<header>
<div class="header-top">
<span class="observatory-mark">Illhart Observatory</span>
<span class="date-mark" id="todayDate"></span>
</div>
<h1>ArXiv Briefing</h1>
<div class="subhead" id="articleCountLine">— articles — RC400 / MK67 follow-up relevance</div>
</header>

<div class="tabs">
<div class="tab active" data-filter="all">All<span class="count" id="countAll"></span></div>
<div class="tab" data-filter="1">Tier 1<span class="count" id="count1"></span></div>
<div class="tab" data-filter="2">Tier 2<span class="count" id="count2"></span></div>
<div class="tab" data-filter="3">Tier 3<span class="count" id="count3"></span></div>
</div>

<main>
<div class="list-view" id="listView">Loading…</div>

<div class="detail-view" id="detailView">
<div class="back-row">
<div class="back-btn" id="backBtn">All articles</div>
</div>
<div class="detail-scroll" id="detailScroll"></div>
</div>
</main>

</div>

<script>
// Real data, fetched from data.json (written daily by arxiv_filter.py on M6).
// Replaces the old hardcoded SAMPLE_ARTICLES mockup — every article, score,
// and arXiv link below is live and traceable back to that run.
let articles = [];
let currentFilter = "all";
let currentArticle = null;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function normalize(raw) {
  return (raw.articles || []).map(a => ({
    id: a.arxiv_id,
    category: a.category,
    title: a.title,
    authors: (a.authors || []).slice(0,3).join(", ") + ((a.authors||[]).length > 3 ? " et al." : ""),
    tier: a.tier,
    score: a.score,
    instrument: a.instrument,
    published: a.published,
    abstract: a.abstract,
    url: a.url,
    tags: [a.instrument, (a.category || "").replace("astro-ph.", "")].filter(Boolean),
  }));
}

function init() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentFilter = tab.dataset.filter;
      renderList();
    });
  });
  document.getElementById("backBtn").addEventListener("click", showList);

  fetch("data.json", { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error("data.json not found (HTTP " + r.status + ")");
      return r.json();
    })
    .then(raw => {
      articles = normalize(raw);

      document.getElementById("todayDate").textContent = (raw.date || "").toUpperCase();

      const genDate = new Date(raw.generated_utc);
      const ageHours = (Date.now() - genDate.getTime()) / 3600000;
      if (ageHours > 30) {
        const banner = document.getElementById("staleBanner");
        banner.style.display = "block";
        banner.textContent = `LAST UPDATED ${Math.round(ageHours)}H AGO — M6 MAY NOT HAVE RUN TODAY`;
      }

      renderCounts();
      renderList();
    })
    .catch(err => {
      document.getElementById("listView").innerHTML =
        `<div class="error-state">Could not load today's briefing.<br>${escapeHtml(err.message)}<br><br>The data feed from M6 may not have been pushed yet.</div>`;
      document.getElementById("articleCountLine").textContent = "— articles — RC400 / MK67 follow-up relevance";
    });
}

function renderCounts() {
  const t1 = articles.filter(a => a.tier === 1).length;
  const t2 = articles.filter(a => a.tier === 2).length;
  const t3 = articles.filter(a => a.tier === 3).length;
  document.getElementById("countAll").textContent = ` ${articles.length}`;
  document.getElementById("count1").textContent = ` ${t1}`;
  document.getElementById("count2").textContent = ` ${t2}`;
  document.getElementById("count3").textContent = ` ${t3}`;
  document.getElementById("articleCountLine").textContent =
    `${articles.length} articles — RC400 / MK67 follow-up relevance`;
}

function renderList() {
  const container = document.getElementById("listView");
  const filtered = currentFilter === "all"
    ? articles
    : articles.filter(a => String(a.tier) === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">No articles in this tier today.</div>`;
    return;
  }

  container.innerHTML = filtered.map(a => `
    <div class="card" data-id="${escapeHtml(a.id)}">
      <div class="card-top">
        <div class="rank-badge tier-${a.tier}">${a.tier}</div>
        <div class="card-cat">${escapeHtml(a.category)}</div>
      </div>
      <div class="card-title">${escapeHtml(a.title)}</div>
      <div class="card-authors">${escapeHtml(a.authors)}</div>
      <div class="card-verdict">Score ${a.score} · ${escapeHtml(a.instrument)} · published ${escapeHtml(a.published)}</div>
      <div class="card-tags">
        ${a.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
      </div>
    </div>
  `).join("");

  container.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openDetail(card.dataset.id));
  });
}

function openDetail(id) {
  currentArticle = articles.find(a => a.id === id);
  if (!currentArticle) return;

  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").classList.add("active");

  renderDetail();
}

function showList() {
  document.getElementById("listView").style.display = "block";
  document.getElementById("detailView").classList.remove("active");
  currentArticle = null;
}

function renderDetail() {
  const a = currentArticle;
  const scroll = document.getElementById("detailScroll");

  scroll.innerHTML = `
    <div class="detail-meta">${escapeHtml(a.category)} · arXiv:${escapeHtml(a.id)}</div>
    <div class="detail-title">${escapeHtml(a.title)}</div>
    <div class="detail-authors">${escapeHtml(a.authors)}</div>

    <div class="score-grid">
      <div class="score-cell">
        <div class="score-cell-label">Relevance score</div>
        <div class="score-cell-value">${a.score} (min ${a.score >= 8 ? "Tier 1" : a.score >= 4 ? "Tier 2" : "Tier 3"})</div>
      </div>
      <div class="score-cell">
        <div class="score-cell-label">Suggested instrument</div>
        <div class="score-cell-value">${escapeHtml(a.instrument)}</div>
      </div>
      <div class="score-cell">
        <div class="score-cell-label">Category</div>
        <div class="score-cell-value">${escapeHtml(a.category)}</div>
      </div>
      <div class="score-cell">
        <div class="score-cell-label">Published</div>
        <div class="score-cell-value">${escapeHtml(a.published)}</div>
      </div>
    </div>

    <div class="abstract-block">
      <div class="section-label">Abstract</div>
      <div class="abstract-text">${escapeHtml(a.abstract)}</div>
    </div>

    <a class="arxiv-link" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">View on arXiv ↗</a>
  `;
}

init();
</script>
</body>
</html>
